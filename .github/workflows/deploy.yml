name: Deploy LiftLog
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify application JavaScript
        run: node --check app.js
      - name: Inject public Supabase configuration
        env:
          URL: ${{ secrets.VITE_SUPABASE_URL }}
          ANON: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          node -e 'const fs=require("fs");if(process.env.URL&&process.env.ANON){fs.writeFileSync("config.js","window.LIFTLOG_CONFIG="+JSON.stringify({url:process.env.URL,anonKey:process.env.ANON})+";\n")}else{console.log("Using committed public configuration")}'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4